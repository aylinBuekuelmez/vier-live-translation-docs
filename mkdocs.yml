site_name: VIER | Live Translation
site_description: Projektdokumentation zur Evaluation von Sprachmodellen für Live Translation
# Optional nach Einrichtung einsetzen:
# site_url: https://USERNAME.github.io/vier-live-translation-docs/
theme:
  name: material
  language: de
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy
plugins:
  - search
nav:
  - Startseite: index.md
  - Projektübersicht: projektuebersicht.md
  - 'Phase 1 – Modellrecherche':
      - Überblick: phase-1-modellrecherche/index.md
      - Auswahlkriterien: phase-1-modellrecherche/auswahlkriterien.md
      - Longlist: phase-1-modellrecherche/longlist.md
      - Shortlist: phase-1-modellrecherche/shortlist.md
      - Detailrecherchen:
          - Google Cloud: phase-1-modellrecherche/google-cloud.md
          - Deepgram: phase-1-modellrecherche/DeepgramSTT-FluxMultilingual&Nova-3.md
          - OpenAI GPT Realtime Translate: phase-1-modellrecherche/OpenAI GPT-Realtime-Translate.md
          - "Soniox": "phase-1-modellrecherche/11. Soniox.md"
          - "Speechmatics": "phase-1-modellrecherche/12. Speechmatics.md"
          - "Alibaba Qwen LiveTranslate": "phase-1-modellrecherche/Alibaba Qwen LiveTranslate (qwen3.5 - 3.8-live-translate-realtime).md"
          - "AWS Transcribe + Translate + Polly": "phase-1-modellrecherche/AWS Transcribe + Translate + Polly.md"
          - "Azure AI Translator": "phase-1-modellrecherche/Azure AI Translator.md"
          - "Deepgram TTS – Aura 2": "phase-1-modellrecherche/Deepgram TTS - Aura 2.md"
          - "DeepL Translation API v3": "phase-1-modellrecherche/DeepL Translation API v3.md"
          - "DeepL Voice API": "phase-1-modellrecherche/DeepL Voice API.md"
          - "ElevenLabs Eleven v3 versus Flash v2.5": "phase-1-modellrecherche/ElevenLabs Eleven v3 versus Flash v2.5.md"
          - "ElevenLabs Scribe v2 Realtime": "phase-1-modellrecherche/ElevenLabs Scribe v2 Realtime.md"
          - "Gladia Solaria": "phase-1-modellrecherche/Gladia Solaria 1 und Solaria 3 - Realtime Speech to Text.md"
          - "Google Cloud Translation API": "phase-1-modellrecherche/Google Cloud Translation API Basic v2 & Advanced v3.md"
          - "Google Gemini 3.5 Live Translate": "phase-1-modellrecherche/Google Gemini 3.5 Live Translate (Preview).md"
          - "Meta SeamlessM4T v2": "phase-1-modellrecherche/Meta Seamless - SeamlessM4T v2.md"
          - "Meta SeamlessStreaming": "phase-1-modellrecherche/Meta SeamlessStreaming.md"
          - "Microsoft Azure Live Interpreter": "phase-1-modellrecherche/Microsoft Azure Speech Translation - Live Interpreter.md"
          - "NVIDIA Riva": "phase-1-modellrecherche/NVIDIA Riva - Speech NIM Pipeline.md"
  - 'Phase 2 – Kriterien & Testdesign':
      - Überblick: phase-2-testdesign/index.md
      - Bewertungsmetriken: phase-2-testdesign/metriken.md
      - Testplan & Szenarien: phase-2-testdesign/testplan.md
      - Testkorpus: phase-2-testdesign/testkorpus.md
  - 'Phase 3 – Evaluierung': phase-3-evaluierung/index.md
  - 'Phase 4 – Auswertung & Übergabe': phase-4-auswertung/index.md
  - Projektfortschritt:
      - Überblick: projektfortschritt/index.md
      - Sprintberichte: projektfortschritt/sprintberichte.md
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
